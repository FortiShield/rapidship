  - name: release
    image: plugins/github-release
    settings:
      files:
        - release/nxenv-migrate-*.tar.gz
        - release/nxenv-migrate-checksums.txt
      api_key:
        from_secret: github_token
    when:
      ref:
        - refs/tags/v*

trigger:
  branch:
    - master
    - refs/tags/v*

