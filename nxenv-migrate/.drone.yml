kind: pipeline
type: docker
name: default

steps:
  - name: test
    image: golang:1.21
    commands:
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out

  - name: build
    image: golang:1.21
    environment:
      CGO_ENABLED: 0
    commands:
      - GOOS=linux   GOARCH=amd64   go build -ldflags "-extldflags=-static -X github.com/nxenv/rapidship/nxenv-migrate/cmd.version=${DRONE_TAG##v}" -o release/linux/amd64/nxenv-migrate
      - GOOS=linux   GOARCH=arm64   go build -ldflags "-extldflags=-static -X github.com/nxenv/rapidship/nxenv-migrate/cmd.version=${DRONE_TAG##v}" -o release/linux/arm64/nxenv-migrate
      - GOOS=darwin  GOARCH=amd64   go build -ldflags "-extldflags=-static -X github.com/nxenv/rapidship/nxenv-migrate/cmd.version=${DRONE_TAG##v}" -o release/darwin/amd64/nxenv-migrate
      - GOOS=darwin  GOARCH=arm64   go build -ldflags "-extldflags=-static -X github.com/nxenv/rapidship/nxenv-migrate/cmd.version=${DRONE_TAG##v}" -o release/darwin/arm64/nxenv-migrate
      - GOOS=windows GOARCH=amd64   go build -ldflags "-extldflags=-static -X github.com/nxenv/rapidship/nxenv-migrate/cmd.version=${DRONE_TAG##v}" -o release/windows/amd64/nxenv-migrate.exe
      - GOOS=windows GOARCH=arm64   go build -ldflags "-extldflags=-static -X github.com/nxenv/rapidship/nxenv-migrate/cmd.version=${DRONE_TAG##v}" -o release/windows/arm64/nxenv-migrate.exe

      - tar -cvzf release/nxenv-migrate-linux-amd64.tar.gz   -C release/linux/amd64   nxenv-migrate
      - tar -cvzf release/nxenv-migrate-linux-arm64.tar.gz   -C release/linux/arm64   nxenv-migrate
      - tar -cvzf release/nxenv-migrate-darwin-amd64.tar.gz  -C release/darwin/amd64  nxenv-migrate
      - tar -cvzf release/nxenv-migrate-darwin-arm64.tar.gz  -C release/darwin/arm64  nxenv-migrate
      - tar -cvzf release/nxenv-migrate-windows-amd64.tar.gz -C release/windows/amd64 nxenv-migrate.exe
      - tar -cvzf release/nxenv-migrate-windows-arm64.tar.gz -C release/windows/arm64 nxenv-migrate.exe

      - sha256sum release/*.tar.gz > release/nxenv-migrate-checksums.txt
